<!DOCTYPE html>
<html>
<head>
<title>Salman Shopping Mall</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f3f3f3;
}

/* TOP NAVBAR */
.navbar{
background:#131921;
color:white;
padding:15px;
font-size:22px;
text-align:center;
}

/* PRODUCTS GRID */
.container{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
padding:20px;
}

.product{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.2);
text-align:center;
}

.product img{
width:100%;
height:200px;
object-fit:cover;
border-radius:5px;
}

button{
background:#FFD814;
border:none;
padding:10px 20px;
margin-top:10px;
cursor:pointer;
border-radius:5px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="navbar">
Salman Shopping Mall
</div>

<div class="container">

<div class="product">
<img src="https://via.placeholder.com/300">
<h3>Clothes</h3>
<p>$25</p>
<button>Add to Cart</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/300">
<h3>Shoes</h3>
<p>$40</p>
<button>Add to Cart</button>
</div>

<div class="product">
<img src="https://via.placeholder.com/300">
<h3>Electronics</h3>
<p>$120</p>
<button>Add to Cart</button>
</div>

</div>

</body>
</html>
